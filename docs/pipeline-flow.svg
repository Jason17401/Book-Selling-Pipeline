<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1124" viewBox="0 0 1600 1124" font-family="Segoe UI, 'Noto Sans CJK TC', 'Microsoft JhengHei', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .lane { font-size: 15px; font-weight: 700; fill: #334155; letter-spacing: .04em; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .dtitle { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .body { font-size: 13.5px; fill: #334155; }
      .dbody { font-size: 13.5px; fill: #cbd5e1; }
      .small { font-size: 13px; fill: #64748b; }
      .step { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
      .flow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .once { stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1124" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Book Selling Pipeline</text>
  <text x="40" y="72" class="small">From a pile of books to sold Shopee listings - every stage, and where it happens. Setup once; then steps 1-9 for every set.</text>
  <rect x="30" y="104" width="1540" height="176" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="1550" y="130" class="lane" text-anchor="end">ONCE - SETUP  (SETUP.md)</text>
  <rect x="60" y="144" width="457" height="120" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.55"/>
  <circle cx="90" cy="170" r="15" fill="#7c3aed"/><text x="90" y="174.5" class="step" text-anchor="middle">S1</text>
  <text x="112" y="176" class="title">Double-click setup.bat</text>
  <text x="78" y="202" class="body">installs everything into .venv,</text>
  <text x="78" y="221" class="body">makes .env and the data folders,</text>
  <text x="78" y="240" class="body">runs the tests</text>
  <rect x="571" y="144" width="457" height="120" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.55"/>
  <circle cx="601" cy="170" r="15" fill="#7c3aed"/><text x="601" y="174.5" class="step" text-anchor="middle">S2</text>
  <text x="623" y="176" class="title">Fill in .env</text>
  <text x="589" y="202" class="body">Telegram bot token + your user id (TELEGRAM_SETUP.md)</text>
  <text x="589" y="221" class="body">free API keys (API_KEYS.md): Google Books,</text>
  <text x="589" y="240" class="body">Tavily, LangSearch, ImgBB</text>
  <path d="M521,204 L565,204" class="once"/>
  <rect x="1083" y="144" width="457" height="120" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.55"/>
  <circle cx="1113" cy="170" r="15" fill="#7c3aed"/><text x="1113" y="174.5" class="step" text-anchor="middle">S3</text>
  <text x="1135" y="176" class="title">Shopee template</text>
  <text x="1101" y="202" class="body">Seller Center &gt; 大量上傳 &gt; 下載基本模板</text>
  <text x="1101" y="221" class="body">save it (any name) in</text>
  <text x="1101" y="240" class="body">data\listings\shopee\template\</text>
  <path d="M1033,204 L1077,204" class="once"/>
  <rect x="30" y="302" width="1540" height="176" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1550" y="328" class="lane" text-anchor="end">ON YOUR PHONE  (Telegram, bot.bat running)</text>
  <rect x="60" y="342" width="457" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.55"/>
  <circle cx="90" cy="368" r="14" fill="#2563eb"/><text x="90" y="372.5" class="step" text-anchor="middle">1</text>
  <text x="112" y="374" class="title">Photograph a set</text>
  <text x="78" y="400" class="body">1 photo of all front covers (2 x 4)</text>
  <text x="78" y="419" class="body">+ 1 back photo per book, in order</text>
  <text x="78" y="438" class="body">(barcode + printed price on it)</text>
  <rect x="571" y="342" width="457" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.55"/>
  <circle cx="601" cy="368" r="14" fill="#2563eb"/><text x="601" y="372.5" class="step" text-anchor="middle">2</text>
  <text x="623" y="374" class="title">Send to your bot</text>
  <text x="589" y="400" class="body">front photo first, then the 8 backs</text>
  <text x="589" y="419" class="body">in one album; a caption can set</text>
  <text x="589" y="438" class="body">condition / price (良好 150)</text>
  <path d="M521,402 L565,402" class="flow"/>
  <rect x="1083" y="342" width="457" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.55"/>
  <circle cx="1113" cy="368" r="14" fill="#2563eb"/><text x="1113" y="372.5" class="step" text-anchor="middle">3</text>
  <text x="1135" y="374" class="title">Send /process</text>
  <text x="1101" y="400" class="body">live progress in the chat;</text>
  <text x="1101" y="419" class="body">then the review sheet and</text>
  <text x="1101" y="438" class="body">what still needs you</text>
  <path d="M1033,402 L1077,402" class="flow"/>
  <rect x="30" y="500" width="1540" height="176" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1550" y="526" class="lane" text-anchor="end">ON THE COMPUTER - AUTOMATIC  (after /process)</text>
  <rect x="60" y="540" width="330" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.55"/>
  <circle cx="90" cy="566" r="14" fill="#16a34a"/><text x="90" y="570.5" class="step" text-anchor="middle">A</text>
  <text x="112" y="572" class="title">Read the photos</text>
  <text x="78" y="598" class="body">barcode → ISBN (+ printed price)</text>
  <text x="78" y="617" class="body">each book&#x27;s cover cut out of</text>
  <text x="78" y="636" class="body">the set photo; front + back picture</text>
  <rect x="444" y="540" width="330" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.55"/>
  <circle cx="474" cy="566" r="14" fill="#16a34a"/><text x="474" y="570.5" class="step" text-anchor="middle">B</text>
  <text x="496" y="572" class="title">Book details</text>
  <text x="462" y="598" class="body">NCL → eslite → books.com.tw</text>
  <text x="462" y="617" class="body">→ Google Books → Open Library</text>
  <text x="462" y="636" class="body">(Chinese title / author preferred)</text>
  <path d="M394,600 L438,600" class="flow"/>
  <rect x="827" y="540" width="330" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.55"/>
  <circle cx="857" cy="566" r="14" fill="#16a34a"/><text x="857" y="570.5" class="step" text-anchor="middle">C</text>
  <text x="879" y="572" class="title">Market price + your price</text>
  <text x="845" y="598" class="body">price barcode → NCL → shops&#x27; search</text>
  <text x="845" y="617" class="body">→ web search (Tavily / LangSearch)</text>
  <text x="845" y="636" class="body">your price = 40% of a new copy</text>
  <path d="M777,600 L821,600" class="flow"/>
  <rect x="1210" y="540" width="330" height="120" rx="10" fill="#0f172a" stroke="#0f172a" stroke-opacity="1"/>
  <text x="1228" y="572" class="dtitle">data\books.csv</text>
  <text x="1228" y="598" class="dbody">one row per book</text>
  <text x="1228" y="617" class="dbody">status: to fix / to check</text>
  <text x="1228" y="636" class="dbody">photos in data\processed\</text>
  <path d="M1160,600 L1204,600" class="flow"/>
  <rect x="30" y="698" width="1540" height="176" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1550" y="724" class="lane" text-anchor="end">ON THE COMPUTER - YOU  (review.bat)</text>
  <rect x="60" y="738" width="457" height="120" rx="10" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.55"/>
  <circle cx="90" cy="764" r="14" fill="#ea580c"/><text x="90" y="768.5" class="step" text-anchor="middle">4</text>
  <text x="112" y="770" class="title">Check every book</text>
  <text x="78" y="796" class="body">red = fill in what is missing</text>
  <text x="78" y="815" class="body">amber = glance at it, Save</text>
  <text x="78" y="834" class="body">(Find price, Shop link, big photos)</text>
  <rect x="571" y="738" width="457" height="120" rx="10" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.55"/>
  <circle cx="601" cy="764" r="14" fill="#ea580c"/><text x="601" y="768.5" class="step" text-anchor="middle">5</text>
  <text x="623" y="770" class="title">Choose how the set sells</text>
  <text x="589" y="796" class="body">Sell this set: as one product,</text>
  <text x="589" y="815" class="body">or each book on its own</text>
  <text x="589" y="834" class="body">(per set, in the Whole set box)</text>
  <path d="M521,798 L565,798" class="flow"/>
  <rect x="1083" y="738" width="457" height="120" rx="10" fill="#0f172a" stroke="#0f172a" stroke-opacity="1"/>
  <text x="1101" y="770" class="dtitle">data\products.csv</text>
  <text x="1101" y="796" class="dbody">one row per product:</text>
  <text x="1101" y="815" class="dbody">a set, or a single book</text>
  <text x="1101" y="834" class="dbody">ready when its books are green</text>
  <path d="M1033,798 L1077,798" class="flow"/>
  <rect x="30" y="896" width="1540" height="176" rx="14" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="1550" y="922" class="lane" text-anchor="end">SELL ON SHOPEE  (review.bat → Sell products, Ctrl+L)</text>
  <rect x="60" y="936" width="330" height="120" rx="10" fill="#ffffff" stroke="#e11d48" stroke-opacity="0.55"/>
  <circle cx="90" cy="962" r="14" fill="#e11d48"/><text x="90" y="966.5" class="step" text-anchor="middle">6</text>
  <text x="112" y="968" class="title">Check each product</text>
  <text x="78" y="994" class="body">title, price / discount,</text>
  <text x="78" y="1013" class="body">stock + minimum purchase,</text>
  <text x="78" y="1032" class="body">description → Save product</text>
  <rect x="444" y="936" width="330" height="120" rx="10" fill="#ffffff" stroke="#e11d48" stroke-opacity="0.55"/>
  <circle cx="474" cy="962" r="14" fill="#e11d48"/><text x="474" y="966.5" class="step" text-anchor="middle">7</text>
  <text x="496" y="968" class="title">Make Shopee upload file</text>
  <text x="462" y="994" class="body">fills your Shopee template;</text>
  <text x="462" y="1013" class="body">photos online on ImgBB (links);</text>
  <text x="462" y="1032" class="body">opens ...\shopee\uploads\</text>
  <path d="M394,996 L438,996" class="flow"/>
  <rect x="827" y="936" width="330" height="120" rx="10" fill="#ffffff" stroke="#e11d48" stroke-opacity="0.55"/>
  <circle cx="857" cy="962" r="14" fill="#e11d48"/><text x="857" y="966.5" class="step" text-anchor="middle">8</text>
  <text x="879" y="968" class="title">Seller Center (you)</text>
  <text x="845" y="994" class="body">我的商品 &gt; 大量上傳: upload it,</text>
  <text x="845" y="1013" class="body">check under 尚未刊登, publish</text>
  <text x="845" y="1032" class="body">(optional: Save link)</text>
  <path d="M777,996 L821,996" class="flow"/>
  <rect x="1210" y="936" width="330" height="120" rx="10" fill="#ffffff" stroke="#e11d48" stroke-opacity="0.55"/>
  <circle cx="1240" cy="962" r="14" fill="#e11d48"/><text x="1240" y="966.5" class="step" text-anchor="middle">9</text>
  <text x="1262" y="968" class="title">Orders</text>
  <text x="1228" y="994" class="body">export the order report,</text>
  <text x="1228" y="1013" class="body">Read Shopee report... :</text>
  <text x="1228" y="1032" class="body">ordered = reserved, done = sold</text>
  <path d="M1160,996 L1204,996" class="flow"/>
  <path d="M1311,466 C1311,510 225,490 225,534" class="flow"/>
  <path d="M1375,664 C1375,708 289,688 289,732" class="flow"/>
  <path d="M1311,862 C1311,906 225,886 225,930" class="flow"/>
</svg>
