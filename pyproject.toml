[tool.pytest.ini_options]
testpaths = ["tests"]
# a test that hangs (e.g. waiting for a window nobody clicks) fails after this many seconds and shows where
timeout = 120

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "B008",   # Qt callbacks bind their values through default arguments on purpose
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B905", "E741"]   # test data: long literal pages, made-up photos

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]
